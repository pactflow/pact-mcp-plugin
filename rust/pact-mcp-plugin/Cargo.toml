[package]
name = "pact-mcp-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pact-mcp-plugin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rmcp = { version = "2.2", features = [
    "client",
    "transport-child-process",
    "server",
    "transport-io",
    # Streamable HTTP client transport (reqwest convenience) — supports custom
    # headers + auth, Mcp-Session-Id, SSE/JSON response modes. See ADR 0007.
    "transport-streamable-http-client-reqwest",
    # Streamable HTTP server transport, for the loopback HTTP consumer mock.
    "transport-streamable-http-server",
    # OAuth2 (client-credentials, SEP-1046). See ADR 0011.
    "auth",
] }
# Needed directly (not just transitively via rmcp) to build the reqwest
# clients OAuthState::new/AuthClient::new take (ADR 0011). `rustls` feature
# (superset of pact_models' `rustls-no-provider`) unifies the crypto-provider
# requirement across the graph; we install the default provider once at
# startup (see `crypto::ensure_default_crypto_provider`) since reqwest/rustls
# don't auto-install it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
http = "1"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
axum = "0.7"
# Real Pact matcher-definition DSL parser + DocPath — the SAME crate/functions
# pact-protobuf-plugin uses (pact_models::matchingrules::expressions), so the
# consumer authoring convention (inline `matching(type, 'x')` / `notEmpty(...)`
# strings) is parsed identically. See ADR 0004.
pact_models = "1.3"
itertools = "0.15"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
glob = "0.3"
